name: Rebuild audited release assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/rebuild_release_assets.py"
      - ".github/workflows/rebuild-release-assets.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: audited-release-assets
  cancel-in-progress: false

jobs:
  rebuild:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install asset dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Rebuild audited assets
        run: python tools/rebuild_release_assets.py

      - name: Run full verification suite
        run: python -m unittest -v tests.test_public_repo tests.test_site_pages tests.test_release_hardening

      - name: Run public boundary verifier
        run: python tools/verify_public_repo.py .

      - name: Commit rebuilt assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distributions/claude/bitcoin-mining-troubleshooter-claude-v1.1.0.zip SHA256SUMS docs README.md
          if git diff --cached --quiet; then
            echo "No rebuilt asset changes to commit."
          else
            git commit -m "fix: apply Claude audit release hardening"
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy hardened site
        id: deployment
        uses: actions/deploy-pages@v4
