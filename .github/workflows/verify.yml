name: Verify public package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Unit tests
        run: python -m unittest -v tests.test_public_repo tests.test_site_pages tests.test_release_hardening tests.test_ui_optimization tests.test_production_hardening tests.test_visual_personality
      - name: Public boundary verifier
        run: python tools/verify_public_repo.py .
