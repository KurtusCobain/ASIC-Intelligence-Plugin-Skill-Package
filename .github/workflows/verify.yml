name: Verify public package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Unit tests
        run: python -m unittest -v tests.test_public_repo
      - name: Public boundary verifier
        run: python tools/verify_public_repo.py .
